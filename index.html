<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
    <title>Cosmic Heart AR - Hell Edition</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Creepster&display=swap" rel="stylesheet">

    <script src="https://aframe.io/releases/1.0.4/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <script src="https://raw.githack.com/donmccurdy/aframe-extras/master/dist/aframe-extras.loaders.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/studio-backend/master/src/modules/marker/tools/gesture-detector.js"></script>
    <script src="https://raw.githack.com/AR-js-org/studio-backend/master/src/modules/marker/tools/gesture-handler.js"></script>

    <style>
        /* --- ESTILOS INFERNALES --- */
        :root {
            /* Nueva paleta de colores infernal */
            --hell-red: #d30000;       /* Rojo sangre oscuro */
            --hell-fire: #ff4500;      /* Naranja fuego brillante */
            --abyss-black: #080000;    /* Negro casi total */
            --ember-glow: 0 0 10px var(--hell-fire), 0 0 20px var(--hell-red); /* Efecto de brasa */
            --grunge-texture: url('https://www.transparenttextures.com/patterns/aged-paper.png');
        }

        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Bangers', cursive;
            background-color: var(--abyss-black);
        }

        /* Pantalla de Carga Infernal */
        #splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            /* Fondo: Gradiente radial que parece un pozo de lava */
            background: radial-gradient(circle at bottom center, #500000 0%, var(--abyss-black) 70%);
            /* Mezclamos la textura con el fondo rojo oscuro */
            background-blend-mode: overlay;
            background-image: var(--grunge-texture);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            color: var(--hell-fire);
            transition: opacity 0.5s ease-out;
        }
        #splash-screen h1 {
            font-family: 'Creepster', cursive; /* Fuente más terrorífica para el título */
            font-size: 4em;
            margin-bottom: 0px;
            text-transform: uppercase;
            letter-spacing: 3px;
            /* Sombra de texto que parece fuego */
            text-shadow: 0px 0px 5px #000, 0px -5px 15px var(--hell-red);
        }
        #splash-screen p {
            font-size: 1.2em;
            color: var(--hell-red);
            letter-spacing: 1px;
        }
        
        /* Animación del cargador tipo "Latido del Infierno" */
        .loader-pulse {
            width: 60px;
            height: 60px;
            background-color: var(--hell-red);
            border-radius: 50%;
            box-shadow: 0 0 20px var(--hell-fire);
            animation: pulse-animation-hell 1.2s infinite ease-in-out;
            margin-top: 20px;
        }
        @keyframes pulse-animation-hell {
            0% { transform: scale(0.8); opacity: 0.8; box-shadow: 0 0 0 0 rgba(255, 69, 0, 0.7); }
            50% { opacity: 1; }
            100% { transform: scale(1.3); opacity: 0; box-shadow: 0 0 0 30px rgba(255, 69, 0, 0); }
        }

        /* Capa de Interfaz de Usuario (HUD) Infernal */
        #ar-hud {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
            /* Viñeta roja oscura y pesada en los bordes */
            background: radial-gradient(circle at center, transparent 40%, rgba(60, 0, 0, 0.95) 100%);
            /* Resplandor interno rojo */
            box-shadow: inset 0 0 100px rgba(211, 0, 0, 0.3);
            /* Borde delgado rojo brillante */
            border: 2px solid var(--hell-red);
            box-sizing: border-box;
        }

        /* Título superior */
        .hud-title {
            position: absolute;
            top: 15px;
            width: 100%;
            text-align: center;
            color: var(--hell-fire);
            font-size: 2em;
            letter-spacing: 2px;
            /* Texto brillante como metal caliente */
            text-shadow: 2px 2px 0px #000, var(--ember-glow);
            pointer-events: auto;
            font-family: 'Creepster', cursive;
        }

        /* Botón de Música Infernal */
        #music-control {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            pointer-events: auto;
            /* Fondo negro semitransparente */
            background-color: rgba(10, 0, 0, 0.8);
            color: var(--hell-fire);
            border: 3px solid var(--hell-red);
            padding: 12px 25px;
            font-family: 'Bangers', cursive;
            font-size: 1.3em;
            cursor: pointer;
            text-transform: uppercase;
            /* Sombra dura roja y resplandor de texto */
            box-shadow: 5px 5px 0px var(--hell-red);
            text-shadow: 0 0 8px var(--hell-fire);
            transition: all 0.2s;
        }
        #music-control:active {
            transform: translateX(-50%) translate(3px, 3px);
            box-shadow: 2px 2px 0px var(--hell-red);
            background-color: var(--hell-red);
            color: black;
        }
    </style>
</head>

<body>
    <div id="splash-screen">
        <h1>Cosmic Heart</h1>
        <p>Abriendo el portal...</p>
        <div class="loader-pulse"></div>
    </div>

    <div id="ar-hud">
        <div class="hud-title">COSMIC SCANNER</div>
        
        <audio id="bg-music" loop>
            <source src="assets/musica_cosmica.mp3" type="audio/mpeg">
        </audio>
        
        <button id="music-control">🔥 INVOCAR SONIDO</button>
    </div>


    <a-scene
        vr-mode-ui="enabled: false;"
        loading-screen="enabled: false;"
        renderer="logarithmicDepthBuffer: true; alpha: true;"
        arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false; patternRatio: 0.75;"
        id="scene"
        embedded
        gesture-detector
    >
        <a-assets>
            <a-asset-item
                id="animated-asset"
                src="assets/asset.glb"
                timeout="10000"
            ></a-asset-item>
        </a-assets>

        <a-marker
            id="animated-marker"
            type="pattern"
            preset="custom"
            url="assets/marker.patt"
            raycaster="objects: .clickable"
            emitevents="true"
            cursor="fuse: false; rayOrigin: mouse;"
            id="markerA"
            smooth="true"
            smoothCount="10"
        >
            <a-entity
                id="model-target"
                scale="0.13999999999999996 0.13999999999999996 0.13999999999999996"
                animation-mixer="loop: repeat"
                gltf-model="#animated-asset"
                class="clickable"
                gesture-handler
            ></a-entity>

             <a-entity light="type: ambient; color: #BBB"></a-entity>
             <a-entity light="type: directional; color: #FFF; intensity: 0.6" position="-0.5 1 1"></a-entity>
        </a-marker>

        <a-entity camera></a-entity>
    </a-scene>

    <script>
        const scene = document.querySelector('a-scene');
        const splash = document.querySelector('#splash-screen');

        scene.addEventListener('loaded', () => {
             setTimeout(() => {
                 splash.style.opacity = '0';
                 setTimeout(() => { splash.style.display = 'none'; }, 500);
             }, 2000); // Un poco más de tiempo para apreciar la pantalla de carga infernal
        });

        const musicBtn = document.getElementById('music-control');
        const music = document.getElementById('bg-music');
        let isPlaying = false;

        musicBtn.addEventListener('click', () => {
            if (isPlaying) {
                music.pause();
                musicBtn.innerText = '🔥 INVOCAR SONIDO';
            } else {
                music.play().then(() => {
                    musicBtn.innerText = '❌ SILENCIAR EL AVERNO';
                }).catch(error => {
                     console.log("Error de audio:", error);
                });
            }
            isPlaying = !isPlaying;
        });
    </script>
</body>
</html>
